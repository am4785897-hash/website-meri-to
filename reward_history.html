<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reward History</title>
<style>body{margin:0;background:#080b14;color:#eef2ff;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.panel{background:#12182a;border:1px solid #28324b;border-radius:14px;padding:18px}.muted{color:#aab4c9}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #28324b}th{color:#aab4c9} .coin{color:#ffd166}.xp{color:#2dd4a7}@media(max-width:700px){table{font-size:12px}}</style></head>
<body><main class="wrap"><p class="muted">ADMIN • REWARD LEDGER</p><h1>📜 Reward History</h1><section class="panel"><table><thead><tr><th>User</th><th>Reward</th><th>Reason</th><th>Coins</th><th>XP</th><th>Time</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{r.user_id}}</td><td>{{r.reward_key}}</td><td>{{r.reason}}</td><td class="coin">+{{r.coins}}</td><td class="xp">+{{r.xp}}</td><td>{{r.timestamp}}</td></tr>{% else %}<tr><td colspan="6" class="muted">No reward transactions yet.</td></tr>{% endfor %}
</tbody></table></section></main></body></html>
