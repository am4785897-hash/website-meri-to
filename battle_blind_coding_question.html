<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Coding Challenge</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#080b14;color:#eef2ff}.wrap{max-width:1050px;margin:auto;padding:25px 16px}.panel{background:#12182a;border:1px solid #28324b;border-radius:14px;padding:18px;margin:14px 0}textarea{width:100%;min-height:330px;box-sizing:border-box;background:#070a12;color:#dce5ff;border:1px solid #28324b;border-radius:10px;padding:14px;font-family:ui-monospace,monospace}button{padding:11px 16px;border:0;border-radius:9px;background:#7657ff;color:#fff;cursor:pointer}.muted{color:#aab4c9}</style></head><body><main class="wrap"><p class="muted">🕶️ BLIND CODING</p><section class="panel"><h1 id="title">Challenge</h1><h2>Problem</h2><p id="problem"></p><p class="muted">Language: Python • Submit your complete solution.</p></section><section class="panel"><textarea id="code" spellcheck="false" placeholder="# Write your solution here"></textarea><br><br><button onclick="submitCode()">Submit Solution</button><p id="result"></p></section></main><script>const data={1:['Number Analyzer','Read an integer and print whether it is positive, negative, or zero.'],2:['String Compressor','Read a string and produce a compact representation of consecutive repeated characters.'],3:['Frequency Counter','Read a sequence of values and report how many times each value occurs.']};const id=new URLSearchParams(location.search).get('id')||'1';const item=data[id]||data[1];document.getElementById('title').textContent=item[0];document.getElementById('problem').textContent=item[1];function submitCode(){document.getElementById('result').textContent=document.getElementById('code').value.trim()?'Submission received. Connect to the server-side judge for real test execution and rewards.':'Write your solution first.'}</script></body></html>
