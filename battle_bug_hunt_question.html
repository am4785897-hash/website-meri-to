<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Hunt Challenge</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#080b14;color:#eef2ff}.wrap{max-width:1050px;margin:auto;padding:25px 16px}.panel{background:#12182a;border:1px solid #28324b;border-radius:14px;padding:18px;margin:14px 0}pre,textarea{width:100%;box-sizing:border-box;background:#070a12;color:#dce5ff;border:1px solid #28324b;border-radius:10px;padding:14px;font-family:ui-monospace,monospace}textarea{min-height:250px}button{padding:11px 16px;border:0;border-radius:9px;background:#7657ff;color:#fff;cursor:pointer}.muted{color:#aab4c9}</style></head><body><main class="wrap"><p class="muted">🐛 BUG HUNT</p><h1>Fix the broken program</h1><section class="panel"><h2>Broken code</h2><pre>def is_even(n):
    if n % 2 = 0:
        return True
    return False</pre></section><section class="panel"><h2>Your fix</h2><textarea id="answer" spellcheck="false"></textarea><br><br><button onclick="submitFix()">Submit Fix</button><p id="result"></p></section></main><script>function submitFix(){const r=document.getElementById('result');r.textContent=document.getElementById('answer').value.trim()?'Submission received. Connect to the server-side judge for execution and rewards.':'Enter corrected code first.'}</script></body></html>
