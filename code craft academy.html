
Codecraft academy · HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCraft Academy — Learn to Code</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0B0E14;
  --surface:#121722;
  --surface-2:#1A2130;
  --surface-3:#212a3d;
  --border:#242c3d;
  --border-soft:#1b2230;
  --text:#E6E8EE;
  --text-dim:#8B95A8;
  --text-faint:#5B6478;
  --teal:#5FD9C4;
  --teal-dim:#2c8f7b;
  --violet:#B693F5;
  --violet-dim:#7d5cc4;
  --amber:#F2B155;
  --red:#F2686D;
  --font-display:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular','Cascadia Code','Consolas','Liberation Mono',monospace;
  --font-body:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --radius:8px;
  --sidebar-w:280px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--teal);color:#04241d;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--border);}
a{color:var(--teal);}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
code,pre{font-family:var(--font-mono);}
 
/* ============ TITLE BAR (signature) ============ */
.titlebar{
  height:44px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:14px;
  position:sticky;top:0;z-index:50;
}
.tl-dots{display:flex;gap:7px;flex-shrink:0;}
.tl-dot{width:11px;height:11px;border-radius:50%;}
.tl-dot.red{background:var(--red);}
.tl-dot.amber{background:var(--amber);}
.tl-dot.teal{background:var(--teal);}
.tl-file{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--text-dim);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-bottom:none;
  padding:6px 14px 5px;
  border-radius:6px 6px 0 0;
  display:flex;align-items:center;gap:8px;
}
.tl-file .dot-unsaved{width:6px;height:6px;border-radius:50%;background:var(--amber);}
.tl-menu-btn{
  display:none;
  margin-left:auto;
  background:transparent;border:1px solid var(--border);
  color:var(--text);border-radius:6px;
  width:32px;height:32px;align-items:center;justify-content:center;
  font-size:16px;
}
.tl-right{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:16px;}
 
/* ============ APP SHELL ============ */
.shell{display:flex;min-height:calc(100vh - 44px);}
 
/* ============ SIDEBAR (file explorer signature) ============ */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:18px 0 24px;
  position:sticky;
  top:44px;
  height:calc(100vh - 44px);
  overflow-y:auto;
}
.sb-section-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.12em;
  color:var(--text-faint);
  text-transform:uppercase;
  padding:0 18px;
  margin:4px 0 8px;
}
.sb-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 18px;
  font-size:13.5px;
  color:var(--text-dim);
  cursor:pointer;
  border-left:2px solid transparent;
  white-space:nowrap;
}
.sb-item:hover{background:var(--surface-2);color:var(--text);}
.sb-item.active{background:var(--surface-2);color:var(--text);border-left-color:var(--teal);}
.sb-item .ico{width:15px;text-align:center;flex-shrink:0;font-size:13px;}
.sb-folder{
  display:flex;align-items:center;gap:8px;
  padding:9px 18px;
  font-size:13.5px;font-weight:500;
  color:var(--text);
  cursor:pointer;
}
.sb-folder .chev{
  font-size:10px;color:var(--text-faint);
  transition:transform .15s ease;
  width:10px;
}
.sb-folder.collapsed .chev{transform:rotate(-90deg);}
.sb-folder .folder-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.sb-lessons{overflow:hidden;}
.sb-lessons.collapsed{display:none;}
.sb-lesson{
  display:flex;align-items:center;gap:8px;
  padding:7px 18px 7px 40px;
  font-size:13px;
  color:var(--text-dim);
  cursor:pointer;
  border-left:2px solid transparent;
}
.sb-lesson:hover{background:var(--surface-2);color:var(--text);}
.sb-lesson.active{background:var(--surface-2);color:var(--text);border-left-color:var(--violet);}
.sb-lesson .check{
  width:14px;height:14px;border-radius:3px;
  border:1.5px solid var(--border);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--bg);
}
.sb-lesson.done .check{background:var(--teal);border-color:var(--teal);}
.sb-footer{
  margin-top:14px;
  padding:14px 18px 0;
  border-top:1px solid var(--border-soft);
}
.diffbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;margin:8px 0;}
.diffbar span{display:block;height:100%;}
.diffbar .fill{background:var(--teal);}
.diffbar .empty{background:var(--surface-3);}
.diffstat{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:flex;justify-content:space-between;}
.diffstat .plus{color:var(--teal);}
.reset-link{
  margin-top:12px;font-family:var(--font-mono);font-size:11px;
  color:var(--text-faint);background:none;border:none;padding:0;
  text-decoration:underline;text-underline-offset:2px;
}
.reset-link:hover{color:var(--red);}
 
/* ============ MAIN ============ */
.main{flex:1;min-width:0;padding:40px 48px 80px;max-width:900px;margin:0 auto;width:100%;}
.eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);margin:0 0 10px;
}
h1.page-title{
  font-family:var(--font-display);font-weight:600;font-size:32px;
  margin:0 0 6px;letter-spacing:-.01em;
}
.subtitle{color:var(--text-dim);font-size:15px;margin:0 0 32px;line-height:1.6;max-width:640px;}
 
/* ============ DASHBOARD ============ */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:36px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;
}
.stat-card .num{font-family:var(--font-display);font-size:26px;font-weight:600;}
.stat-card .lbl{font-size:12px;color:var(--text-dim);margin-top:4px;font-family:var(--font-mono);}
.stat-card.teal .num{color:var(--teal);}
.stat-card.violet .num{color:var(--violet);}
.stat-card.amber .num{color:var(--amber);}
 
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.course-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px;cursor:pointer;transition:border-color .15s ease,transform .1s ease;
  display:flex;flex-direction:column;gap:12px;
}
.course-card:hover{border-color:var(--surface-3);transform:translateY(-2px);}
.course-card .top{display:flex;align-items:center;gap:10px;}
.course-card .badge{
  font-family:var(--font-mono);font-size:18px;font-weight:700;
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
}
.course-card h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600;}
.course-card p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.5;}
.course-card .cprog-track{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;}
.course-card .cprog-fill{height:100%;border-radius:3px;}
.course-card .cprog-txt{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
 
.exam-cta{
  margin-top:36px;border:1px dashed var(--border);border-radius:10px;padding:24px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--surface);
}
.exam-cta.ready{border-style:solid;border-color:var(--violet-dim);}
.exam-cta h3{margin:0 0 6px;font-family:var(--font-display);font-size:17px;}
.exam-cta p{margin:0;color:var(--text-dim);font-size:13px;max-width:420px;}
 
/* ============ BUTTONS ============ */
.btn{
  font-family:var(--font-mono);font-size:13px;font-weight:500;
  padding:10px 18px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--text);
  display:inline-flex;align-items:center;gap:8px;
  transition:background .12s ease,border-color .12s ease;
  white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--surface-3);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#04241d;font-weight:600;}
.btn-primary:hover:not(:disabled){background:#7ce6d4;border-color:#7ce6d4;}
.btn-violet{background:var(--violet);border-color:var(--violet);color:#211238;font-weight:600;}
.btn-violet:hover:not(:disabled){background:#c8a9fa;}
.btn-ghost{border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 12px;font-size:12px;}
 
/* ============ BREADCRUMB / NAV ============ */
.crumb{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-bottom:14px;}
.crumb .sep{margin:0 6px;}
.crumb .cur{color:var(--text-dim);}
 
/* ============ LESSON ============ */
.lesson-body{font-size:15.5px;line-height:1.75;color:var(--text);}
.lesson-body h2{
  font-family:var(--font-display);font-size:20px;font-weight:600;margin:32px 0 12px;
  color:var(--text);
}
.lesson-body h2:first-child{margin-top:0;}
.lesson-body p{margin:0 0 16px;color:#c7cbd6;}
.lesson-body ul{margin:0 0 16px;padding-left:20px;color:#c7cbd6;}
.lesson-body li{margin-bottom:6px;}
.lesson-body code.inline{
  background:var(--surface-2);border:1px solid var(--border);color:var(--amber);
  padding:1px 6px;border-radius:4px;font-size:.88em;
}
.code-block{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin:18px 0 22px;overflow:hidden;
}
.code-block .cb-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;border-bottom:1px solid var(--border);
  font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
}
.code-block pre{margin:0;padding:16px;overflow-x:auto;font-size:13px;line-height:1.6;}
.code-block .tag{color:var(--violet);}
.code-block .attr{color:var(--amber);}
.code-block .str{color:var(--teal);}
.code-block .kw{color:var(--violet);}
.code-block .cm{color:var(--text-faint);}
.code-block .fn{color:var(--amber);}
 
.callout{
  border-left:3px solid var(--teal);background:var(--surface);
  padding:12px 16px;border-radius:0 8px 8px 0;margin:18px 0;font-size:14px;color:#c7cbd6;
}
.lesson-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:44px;padding-top:24px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap;
}
 
/* ============ QUIZ ============ */
.quiz-wrap{
  margin-top:36px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);overflow:hidden;
}
.quiz-head{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.quiz-head h3{margin:0;font-family:var(--font-display);font-size:16px;display:flex;align-items:center;gap:8px;}
.quiz-body{padding:20px;}
.q-block{margin-bottom:26px;}
.q-block:last-child{margin-bottom:0;}
.q-prompt{font-size:14.5px;font-weight:500;margin-bottom:12px;display:flex;gap:8px;}
.q-prompt .qnum{font-family:var(--font-mono);color:var(--text-faint);flex-shrink:0;}
.q-options{display:flex;flex-direction:column;gap:8px;}
.q-opt{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border:1px solid var(--border);border-radius:7px;
  font-size:13.5px;color:var(--text-dim);
  background:var(--surface-2);
}
.q-opt:hover{border-color:var(--surface-3);}
.q-opt input{accent-color:var(--teal);}
.q-opt.selected{border-color:var(--violet-dim);color:var(--text);}
.q-opt.correct{border-color:var(--teal);background:rgba(95,217,196,.08);color:var(--teal);}
.q-opt.wrong{border-color:var(--red);background:rgba(242,104,109,.08);color:var(--red);}
.quiz-result{
  padding:16px 20px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.quiz-result .score-txt{font-family:var(--font-mono);font-size:14px;}
.quiz-result.pass .score-txt{color:var(--teal);}
.quiz-result.fail .score-txt{color:var(--red);}
 
.locked-note{
  display:flex;align-items:center;gap:8px;color:var(--text-faint);font-size:12px;
  font-family:var(--font-mono);
}
 
/* ============ EXAM ============ */
.exam-progress-track{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin:16px 0 28px;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));border-radius:4px;transition:width .2s ease;}
 
/* ============ CERTIFICATE ============ */
.cert-form{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:24px;margin-bottom:32px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px;}
.field label{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.field input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:6px;font-size:14px;font-family:var(--font-body);
}
.field input:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
 
.cert-stage{display:flex;justify-content:center;padding:20px 0;}
#certificate{
  width:900px;max-width:100%;aspect-ratio:1.414/1;
  background:#0d1016;
  border:1px solid #2a3346;
  position:relative;
  padding:36px;
  font-family:var(--font-mono);
  color:#e6e8ee;
  display:flex;flex-direction:column;
}
#certificate .cert-border{
  position:absolute;inset:14px;border:2px solid #2c3648;pointer-events:none;
}
#certificate .cert-border::before{
  content:"";position:absolute;inset:6px;border:1px solid #1e2636;
}
#certificate .cert-inner{position:relative;flex:1;display:flex;flex-direction:column;padding:22px;}
#certificate .cert-topline{font-size:11px;color:var(--text-faint);display:flex;justify-content:space-between;}
#certificate .cert-prompt{color:var(--teal);}
#certificate .cert-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;}
#certificate .cert-kicker{font-size:11px;letter-spacing:.25em;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px;}
#certificate .cert-name{
  font-family:var(--font-display);font-size:40px;font-weight:700;color:#fff;
  border-bottom:2px solid var(--teal);padding-bottom:10px;margin-bottom:14px;
  letter-spacing:.01em;
}
#certificate .cert-desc{font-size:13px;color:#c7cbd6;max-width:520px;line-height:1.7;}
#certificate .cert-course{color:var(--violet);font-weight:600;}
#certificate .cert-bottom{
  display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;color:var(--text-faint);
  margin-top:20px;
}
#certificate .cert-sig{text-align:center;}
#certificate .cert-sig .line{width:150px;border-top:1px solid #3a4358;margin-bottom:6px;}
#certificate .cert-score{
  font-size:12px;color:var(--teal);
}
.blink{animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:0;}}
 
.cert-actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
 
.locked-panel{
  border:1px solid var(--border);border-radius:10px;background:var(--surface);
  padding:40px 24px;text-align:center;color:var(--text-dim);
}
.locked-panel .ico{font-size:28px;margin-bottom:12px;color:var(--text-faint);}
 
/* ============ TOAST ============ */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:12px 20px;border-radius:8px;font-size:13px;font-family:var(--font-mono);
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
 
/* ============ RESPONSIVE ============ */
@media (max-width:880px){
  .sidebar{
    position:fixed;left:0;top:44px;z-index:100;
    transform:translateX(-100%);
    transition:transform .2s ease;
    box-shadow:20px 0 40px rgba(0,0,0,.4);
  }
  .sidebar.open{transform:translateX(0);}
  .tl-menu-btn{display:flex;}
  .main{padding:28px 20px 60px;}
  h1.page-title{font-size:24px;}
  #certificate{padding:18px;}
  #certificate .cert-name{font-size:26px;}
  #certificate .cert-bottom{flex-direction:column;gap:14px;align-items:center;text-align:center;}
  .cert-form{flex-direction:column;align-items:stretch;}
}
@media (max-width:480px){
  .stat-row{grid-template-columns:1fr 1fr;}
  .course-grid{grid-template-columns:1fr;}
}
.sb-overlay{
  display:none;position:fixed;inset:0;top:44px;background:rgba(0,0,0,.5);z-index:90;
}
.sb-overlay.show{display:block;}
</style>
</head>
<body>
 
<div class="titlebar">
  <div class="tl-dots"><span class="tl-dot red"></span><span class="tl-dot amber"></span><span class="tl-dot teal"></span></div>
  <div class="tl-file"><span class="dot-unsaved" id="unsavedDot" style="display:none;"></span><span id="tlFileName">dashboard.js</span></div>
  <div class="tl-right"><span id="clockTxt"></span></div>
  <button class="tl-menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
</div>
 
<div class="shell">
  <div class="sb-overlay" id="sbOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-section-label">navigator</div>
    <div class="sb-item" data-route="dashboard"><span class="ico">▤</span> Dashboard</div>
 
    <div id="courseNav"></div>
 
    <div class="sb-section-label" style="margin-top:14px;">assessment</div>
    <div class="sb-item" data-route="exam"><span class="ico">✓</span> Final Exam</div>
    <div class="sb-item" data-route="certificate"><span class="ico">◈</span> Certificate</div>
 
    <div class="sb-footer">
      <div class="sb-section-label" style="padding:0;margin-bottom:6px;">overall progress</div>
      <div class="diffbar" id="sbDiffbar"></div>
      <div class="diffstat"><span class="plus" id="sbDiffText">+0</span><span id="sbDiffPct">0%</span></div>
      <button class="reset-link" id="resetBtn">reset all progress</button>
    </div>
  </aside>
 
  <main class="main" id="mainContent"></main>
</div>
 
<div id="toast"></div>
 
<script>
/* =========================================================
   CODECRAFT ACADEMY — single-file learning platform
   ========================================================= */
 
/* ---------- DATA ---------- */
const COURSES = [
  {
    id:'html', title:'HTML Foundations', short:'HTML', color:'var(--teal)', dotBg:'rgba(95,217,196,.14)',
    desc:'Learn the basic building blocks of every web page, one simple step at a time.',
    lessons:[
      {
        id:'html-1', title:'Structure & Semantic Tags',
        content:`
          <h2>What is HTML?</h2>
          <p>HTML stands for <strong>HyperText Markup Language</strong>. It's the code used to build every web page. Think of it like the skeleton of a house — it gives the page its basic shape.</p>
          <p>Every HTML page has the same simple shape: a <code class="inline">&lt;head&gt;</code> (info about the page) and a <code class="inline">&lt;body&gt;</code> (what people actually see).</p>
          <h2>Tags that describe parts of a page</h2>
          <p>HTML uses "tags" to label different parts of the page, so both browsers and people know what each part is for. Here are the main ones, in plain words:</p>
          <ul>
            <li><code class="inline">&lt;header&gt;</code> — the top part, usually with a title or menu</li>
            <li><code class="inline">&lt;nav&gt;</code> — the menu links people click to move around</li>

const PASS_THRESHOLD = 60;
const STORAGE_KEY = 'codecraft_academy_state_v1';
 
/* ---------- STATE ---------- */
function defaultState(){
  return { completed:{}, examResult:null, certName:'' };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  flashUnsaved();
}
let state = loadState();
 
function flashUnsaved(){
  const dot = document.getElementById('unsavedDot');
  dot.style.display='inline-block';
  setTimeout(()=>{ dot.style.display='none'; }, 700);
}
 
function totalLessons(){
  return COURSES.reduce((sum,c)=>sum+c.lessons.length,0);
}
function completedCount(){
  return Object.values(state.completed).filter(v=>v && v.done).length;
}
function courseCompletedCount(course){
  return course.lessons.filter(l=>state.completed[l.id] && state.completed[l.id].done).length;
}
function allLessonsDone(){
  return completedCount() === totalLessons();
}
function findLesson(id){
  for(const c of COURSES){
    const l = c.lessons.find(x=>x.id===id);
    if(l) return {course:c, lesson:l};
  }
  return null;
}
 
/* ---------- ROUTER ---------- */
function currentRoute(){
  const hash = location.hash.replace(/^#\/?/,'') || 'dashboard';
  return hash;
}
window.addEventListener('hashchange', render);
 
/* ---------- TOAST ---------- */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'), 2400);
}
 
/* ---------- CLOCK ---------- */
function tickClock(){
  const now=new Date();
  document.getElementById('clockTxt').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock,1000*20);
 
/* ---------- SIDEBAR ---------- */
let collapsedFolders = {};
function renderSidebar(){
  const nav = document.getElementById('courseNav');
  nav.innerHTML = COURSES.map(course=>{
    const done = courseCompletedCount(course);
    const isCollapsed = !!collapsedFolders[course.id];
    const lessonsHtml = course.lessons.map(l=>{
      const isDone = state.completed[l.id] && state.completed[l.id].done;
      return `<div class="sb-lesson ${isDone?'done':''}" data-route="lesson/${l.id}">
        <span class="check">${isDone?'✓':''}</span><span>${l.title}</span>
      </div>`;
    }).join('');
    return `
      <div class="sb-folder ${isCollapsed?'collapsed':''}" data-folder="${course.id}">
        <span class="chev">▾</span>
        <span class="folder-dot" style="background:${course.color}"></span>
        <span>${course.title}</span>
        <span style="margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);">${done}/${course.lessons.length}</span>
      </div>
      <div class="sb-lessons ${isCollapsed?'collapsed':''}">${lessonsHtml}</div>
    `;
  }).join('');
 
  const route = currentRoute();
  document.querySelectorAll('.sb-item, .sb-lesson').forEach(el=>{
    el.classList.toggle('active', el.dataset.route === route);
  });
 
  const done = completedCount();
  const total = totalLessons();
  const pct = total ? Math.round((done/total)*100) : 0;
  const bar = document.getElementById('sbDiffbar');
  bar.innerHTML='';
  for(let i=0;i<total;i++){
    const span=document.createElement('span');
    span.className = i<done ? 'fill' : 'empty';
    span.style.flex='1';
    bar.appendChild(span);
  }
  document.getElementById('sbDiffText').textContent = `+${done}`;
  document.getElementById('sbDiffPct').textContent = `${pct}%`;
}
 
document.addEventListener('click', (e)=>{
  const folder = e.target.closest('.sb-folder');
  if(folder){
    const id = folder.dataset.folder;
    collapsedFolders[id] = !collapsedFolders[id];
    renderSidebar();
    return;
  }
  const navItem = e.target.closest('[data-route]');
  if(navItem){
    location.hash = '#/'+navItem.dataset.route;
    closeMobileSidebar();
  }
});
 
/* mobile sidebar toggle */
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sbOverlay').classList.remove('show');
}
document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sbOverlay').classList.toggle('show');
});

/* ---------- RENDER: LESSON ---------- */
function viewLesson(lessonId){
  const found = findLesson(lessonId);
  if(!found) return viewNotFound();
  const {course, lesson} = found;
  document.getElementById('tlFileName').textContent = lesson.id+'.html';
 
  const idx = course.lessons.findIndex(l=>l.id===lesson.id);
  const prev = course.lessons[idx-1];
  const next = course.lessons[idx+1];
  const savedResult = state.completed[lesson.id];
 
  return `
    <div class="crumb"><span data-route="dashboard" style="cursor:pointer;">dashboard</span><span class="sep">/</span><span data-route="course/${course.id}" style="cursor:pointer;">${course.title}</span><span class="sep">/</span><span class="cur">${lesson.title}</span></div>
    <div class="eyebrow">lesson ${idx+1} of ${course.lessons.length}</div>
    <h1 class="page-title">${lesson.title}</h1>
    <div class="lesson-body">${lesson.content}</div>
 
    <div class="quiz-wrap" id="quizWrap" data-lesson="${lesson.id}">
      <div class="quiz-head">
        <h3><span>■</span> Knowledge check</h3>
        <span class="locked-note">${savedResult ? 'best score: '+savedResult.score+'%' : PASS_THRESHOLD+'% required to pass'}</span>
      </div>
      <div class="quiz-body" id="quizBody"></div>
    </div>
 
    <div class="lesson-nav">
      <button class="btn" ${prev?'':'disabled'} data-route="${prev?('lesson/'+prev.id):''}">← Previous lesson</button>
      <button class="btn" data-route="course/${course.id}">Course overview</button>
      <button class="btn" ${next?'':'disabled'} data-route="${next?('lesson/'+next.id):''}">Next lesson →</button>
    </div>
  `;
}
 
function renderQuiz(lessonId){
  const found = findLesson(lessonId);
  if(!found) return;
  const {lesson} = found;
  const body = document.getElementById('quizBody');
  if(!body) return;
 
  const selections = new Array(lesson.quiz.length).fill(null);
 
  function draw(submitted, results){
    body.innerHTML = lesson.quiz.map((q,qi)=>{
      const optsHtml = q.options.map((opt,oi)=>{
        let cls='q-opt';
        if(!submitted && selections[qi]===oi) cls+=' selected';
        if(submitted){
          if(oi===q.answer) cls+=' correct';
          else if(selections[qi]===oi && oi!==q.answer) cls+=' wrong';
        }
        return `<label class="${cls}">
          <input type="radio" name="q${qi}" value="${oi}" ${selections[qi]===oi?'checked':''} ${submitted?'disabled':''}>
          <span>${escapeHtml(opt)}</span>
        </label>`;
      }).join('');
      return `<div class="q-block">
        <div class="q-prompt"><span class="qnum">Q${qi+1}.</span><span>${escapeHtml(q.q)}</span></div>
        <div class="q-options">${optsHtml}</div>
      </div>`;
    }).join('') + (submitted ? '' : `<button class="btn btn-primary" id="submitQuizBtn" style="margin-top:6px;">Submit answers</button>`);
 
    if(!submitted){
      body.querySelectorAll('input[type=radio]').forEach(inp=>{
        inp.addEventListener('change', (e)=>{
          const qi = parseInt(e.target.name.replace('q',''));
          selections[qi] = parseInt(e.target.value);
          draw(false);
        });
      });
      const btn = document.getElementById('submitQuizBtn');
      if(btn){
        btn.disabled = selections.includes(null);
        btn.addEventListener('click', ()=>{
          let correct=0;
          lesson.quiz.forEach((q,qi)=>{ if(selections[qi]===q.answer) correct++; });
          const score = Math.round((correct/lesson.quiz.length)*100);
          const passed = score >= PASS_THRESHOLD;
          if(passed || !state.completed[lesson.id] || score > state.completed[lesson.id].score){
            state.completed[lesson.id] = { done:passed, score: Math.max(score, (state.completed[lesson.id]&&state.completed[lesson.id].score)||0) };
            if(passed) state.completed[lesson.id].done = true;
            saveState();
          }
          renderSidebar();
          draw(true, {correct, score, passed});
          const resultBar = document.createElement('div');
          resultBar.className = 'quiz-result ' + (passed?'pass':'fail');
          resultBar.innerHTML = `
            <span class="score-txt">${correct}/${lesson.quiz.length} correct — ${score}%${passed?' · lesson complete':' · try again to pass'}</span>
            <button class="btn btn-sm" id="retryQuizBtn">${passed?'Retake quiz':'Retry quiz'}</button>
          `;
          body.after(resultBar);
          document.getElementById('retryQuizBtn').addEventListener('click', ()=>{
            resultBar.remove();
            selections.fill(null);
            draw(false);
          });
          if(passed) toast('Lesson complete — nice work!');
        });
      }
    }
  }
  draw(false);
}
 
/* ---------- RENDER: EXAM ---------- */
function buildExamQuestions(){
  const pool=[];
  COURSES.forEach(course=>{
    course.lessons.forEach(lesson=>{
      lesson.quiz.slice(0,2).forEach(q=>{
        pool.push({ q:q.q, options:q.options, answer:q.answer, course:course.short });
      });
    });
  });
  return pool;
}

function renderExam(){
  const area = document.getElementById('examArea');
  if(!area) return;
  const selections = new Array(EXAM_QUESTIONS.length).fill(null);
 
  function updateProgress(){
    const answered = selections.filter(s=>s!==null).length;
    const fill = document.getElementById('examProgFill');
    if(fill) fill.style.width = Math.round((answered/EXAM_QUESTIONS.length)*100)+'%';
  }
 
  function draw(submitted, summary){
    let html = `<div class="exam-progress-track"><div class="exam-progress-fill" id="examProgFill" style="width:0%"></div></div>`;
    html += `<div class="quiz-wrap"><div class="quiz-body">`;
    html += EXAM_QUESTIONS.map((q,qi)=>{
      const optsHtml = q.options.map((opt,oi)=>{
        let cls='q-opt';
        if(!submitted && selections[qi]===oi) cls+=' selected';
        if(submitted){
          if(oi===q.answer) cls+=' correct';
          else if(selections[qi]===oi && oi!==q.answer) cls+=' wrong';
        }
        return `<label class="${cls}">
          <input type="radio" name="e${qi}" value="${oi}" ${selections[qi]===oi?'checked':''} ${submitted?'disabled':''}>
          <span>${escapeHtml(opt)}</span>
        </label>`;
      }).join('');
      return `<div class="q-block">
        <div class="q-prompt"><span class="qnum">Q${qi+1} <span style="color:var(--text-faint);">[${q.course}]</span></span><span>${escapeHtml(q.q)}</span></div>
        <div class="q-options">${optsHtml}</div>
      </div>`;
    }).join('');
    html += `</div>`;
    if(!submitted){
      html += `<div class="quiz-result"><span class="locked-note" id="examCounter">0/${EXAM_QUESTIONS.length} answered</span><button class="btn btn-violet" id="submitExamBtn" disabled>Submit exam</button></div>`;
    }
    html += `</div>`;
    area.innerHTML = html;
 
    if(!submitted){
      area.querySelectorAll('input[type=radio]').forEach(inp=>{
        inp.addEventListener('change',(e)=>{
          const qi=parseInt(e.target.name.replace('e',''));
          selections[qi]=parseInt(e.target.value);
          const answered = selections.filter(s=>s!==null).length;
          document.getElementById('examCounter').textContent = `${answered}/${EXAM_QUESTIONS.length} answered`;
          document.getElementById('submitExamBtn').disabled = answered !== EXAM_QUESTIONS.length;
          updateProgress();
        });
      });
      const submitBtn = document.getElementById('submitExamBtn');
      submitBtn.addEventListener('click', ()=>{
        let correct=0;
        EXAM_QUESTIONS.forEach((q,qi)=>{ if(selections[qi]===q.answer) correct++; });
        const score = Math.round((correct/EXAM_QUESTIONS.length)*100);
        const passed = score >= PASS_THRESHOLD;
        state.examResult = { score, passed, correct, totalQ:EXAM_QUESTIONS.length, date:new Date().toISOString() };
        saveState();
        renderSidebar();
        draw(true);
        const resultBar = document.createElement('div');
        resultBar.className = 'quiz-result ' + (passed?'pass':'fail');
        resultBar.innerHTML = `
          <span class="score-txt">${correct}/${EXAM_QUESTIONS.length} correct — ${score}% — ${passed?'PASSED':'not passed'}</span>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-sm" id="retryExamBtn">Retake exam</button>
            ${passed?'<button class="btn btn-sm btn-violet" data-route="certificate">Get certificate →</button>':''}
          </div>
        `;
        area.querySelector('.quiz-wrap').appendChild(resultBar);
        toast(passed ? 'Exam passed! Certificate unlocked.' : 'Not quite — review the material and try again.');
        const retry = document.getElementById('retryExamBtn');
        if(retry) retry.addEventListener('click', ()=>{
          selections.fill(null);
          draw(false);
        });
      });
    }
  }
  draw(false);
}

function escapeHtml(str){

/* ---------- PDF GENERATION (pure JS, no external libraries) ---------- */
function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(word=>{
    const test = cur ? cur+' '+word : word;
    if(ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur);
      cur = word;
    }else{
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines;
}
 
function drawCertificateCanvas(){
  const W = 1600, H = 1131; // ~1.414 ratio, high-res for crisp PDF
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
 
  const name = state.certName || 'Student';
  const score = state.examResult.score;
  const dateStr = new Date(state.examResult.date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  const idStr = (name||'guest').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8) || 'guest';
  const year = new Date(state.examResult.date).getFullYear();
 
  const bg='#0d1016', border='#2c3648', innerBorder='#1e2636', faint='#5B6478',
        text='#e6e8ee', teal='#5fd9c4', violet='#b693f5', muted='#c7cbd6';
 
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);
 
  ctx.strokeStyle = border; ctx.lineWidth = 3;
  ctx.strokeRect(24,24,W-48,H-48);
  ctx.strokeStyle = innerBorder; ctx.lineWidth = 1.5;
  ctx.strokeRect(34,34,W-68,H-68);
 
  const pad = 70;
  ctx.font = '20px ui-monospace, monospace';
  ctx.fillStyle = teal;
  ctx.textAlign = 'left'; ctx.textBaseline='top';
  ctx.fillText('codecraft_academy@certify _', pad, pad);
  ctx.fillStyle = faint;
  ctx.textAlign = 'right';
  ctx.fillText(`ID #${idStr}-${year}`, W-pad, pad);
 
  ctx.textAlign = 'center';
  ctx.fillStyle = faint;
  ctx.font = '18px ui-monospace, monospace';
  ctx.fillText('C E R T I F I C A T E   O F   C O M P L E T I O N', W/2, H*0.28);
 
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 64px -apple-system, Segoe UI, Arial, sans-serif';
  ctx.fillText(name, W/2, H*0.36);
  const nameWidth = ctx.measureText(name).width;
  ctx.strokeStyle = teal; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2 - nameWidth/2 - 10, H*0.36 + 90);
  ctx.lineTo(W/2 + nameWidth/2 + 10, H*0.36 + 90);
  ctx.stroke();
 
  ctx.font = '22px ui-monospace, monospace';
  ctx.fillStyle = muted;
  const desc1 = 'has successfully completed the Full-Stack Web Fundamentals program on';
  const desc2 = 'CodeCraft Academy, covering HTML, CSS and JavaScript, and passed the final';
  const desc3 = `exam with a score of ${score}%.`;
  ctx.fillText(desc1, W/2, H*0.36 + 140);
  ctx.fillText(desc2, W/2, H*0.36 + 172);
  ctx.fillStyle = text;
  ctx.font = 'bold 22px ui-monospace, monospace';
  ctx.fillText(desc3, W/2, H*0.36 + 204);
 
  ctx.font = '17px ui-monospace, monospace';
  ctx.fillStyle = faint;
  ctx.textAlign = 'left';
  ctx.strokeStyle = '#3a4358'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, H-140); ctx.lineTo(pad+220, H-140); ctx.stroke();
  ctx.fillText('Program Director', pad, H-128);
 
  ctx.textAlign = 'center';
  ctx.fillStyle = teal;
  ctx.fillText('exit_code: 0 — PASS', W/2, H-120);
 
  ctx.textAlign = 'right';
  ctx.fillStyle = faint;
  ctx.beginPath(); ctx.moveTo(W-pad-220, H-140); ctx.lineTo(W-pad, H-140); ctx.stroke();
  ctx.fillText(dateStr, W-pad, H-128);
 
  return canvas;
}
 
function buildMinimalPdf(canvas){
  const W = 842, H = 595; // A4 landscape, in points
  const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.92);
  const base64 = jpegDataUrl.split(',')[1];
  const binary = atob(base64);
  const jpegBytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) jpegBytes[i] = binary.charCodeAt(i);
 
  const enc = (s)=> new TextEncoder().encode(s);
  const parts = [];
  let offset = 0;
  const xrefOffsets = [0,0,0,0,0,0];
  function push(bytes){ parts.push(bytes); offset += bytes.length; }
 
  push(enc('%PDF-1.4\n'));
 
  xrefOffsets[1] = offset;
  push(enc('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n'));
 
  xrefOffsets[2] = offset;
  push(enc('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n'));
 
  xrefOffsets[3] = offset;
  push(enc(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`));
 
  xrefOffsets[4] = offset;
  push(enc(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`));
  push(jpegBytes);
  push(enc('\nendstream\nendobj\n'));
 
  xrefOffsets[5] = offset;
  const contentStr = `q\n${W} 0 0 ${H} 0 0 cm\n/Im0 Do\nQ`;
  const contentBytes = enc(contentStr);
  push(enc(`5 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`));
  push(contentBytes);
  push(enc('\nendstream\nendobj\n'));
 
  const xrefStart = offset;
  let xref = 'xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++){
    xref += String(xrefOffsets[i]).padStart(10,'0') + ' 00000 n \n';
  }
  push(enc(xref));
  push(enc(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`));
 
  let total = 0;
  parts.forEach(p=>total+=p.length);
  const full = new Uint8Array(total);
  let pos = 0;
  parts.forEach(p=>{ full.set(p,pos); pos += p.length; });
  return full;
}
 
function wireCertificate(){
  const applyBtn = document.getElementById('applyNameBtn');
  const input = document.getElementById('certNameInput');
  if(applyBtn && input){
    applyBtn.addEventListener('click', ()=>{
      const val = input.value.trim();
      if(!val){ toast('Enter your name first'); return; }
      state.certName = val;
      saveState();
      render();
      toast('Certificate updated');
    });
    input.addEventListener('keydown',(e)=>{
      if(e.key==='Enter') applyBtn.click();
    });
  }
  const dlBtn = document.getElementById('downloadCertBtn');
  if(dlBtn){
    dlBtn.addEventListener('click', ()=>{
      if(!state.certName){ toast('Enter your name and click "Apply to certificate" first'); return; }
      dlBtn.disabled = true;
      const original = dlBtn.textContent;
      dlBtn.textContent = 'Generating…';
      try{
        const canvas = drawCertificateCanvas();
        const pdfBytes = buildMinimalPdf(canvas);
        const blob = new Blob([pdfBytes], {type:'application/pdf'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `CodeCraft-Certificate-${state.certName.replace(/\s+/g,'_')}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
        toast('Certificate downloaded');
      }catch(err){
        console.error(err);
        toast('Could not generate PDF — please try again');
      }finally{
        dlBtn.disabled = false;
        dlBtn.textContent = original;
      }
    });
  }
}
 
/* ---------- RENDER: NOT FOUND ---------- */
function viewNotFound(){
  return `
    <div class="eyebrow">404</div>
    <h1 class="page-title">Nothing here</h1>
    <p class="subtitle">That page doesn't exist.</p>
    <button class="btn btn-primary" data-route="dashboard">Back to dashboard</button>
  `;
}
 
/* ---------- MAIN RENDER ---------- */
function render(){
  const route = currentRoute();
  const main = document.getElementById('mainContent');
  const parts = route.split('/');
 
  if(parts[0]==='course' && parts[1]){
    main.innerHTML = viewCourse(parts[1]);
  }else if(parts[0]==='lesson' && parts[1]){
    main.innerHTML = viewLesson(parts[1]);
    renderQuiz(parts[1]);
  }else if(parts[0]==='exam'){
    main.innerHTML = viewExam();
    if(allLessonsDone()) renderExam();
  }else if(parts[0]==='certificate'){
    main.innerHTML = viewCertificate();
    wireCertificate();
  }else{
    main.innerHTML = viewDashboard();
  }
  renderSidebar();
  window.scrollTo({top:0, behavior:'instant'});
}
 
/* ---------- INIT ---------- */
if(!location.hash) location.hash = '#/dashboard';
render();
</script>
